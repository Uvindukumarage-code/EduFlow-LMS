server:
  port: 8084
spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:eduflow}
    password: ${SPRING_DATASOURCE_PASSWORD:eduflow123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
api:
  key: ${API_KEY:PAYMENT-SERVICE-KEY-2024}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
