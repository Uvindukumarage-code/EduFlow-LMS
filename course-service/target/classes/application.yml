server:
  port: 8082
spring:
  application:
    name: course-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:eduflow}
    password: ${SPRING_DATASOURCE_PASSWORD:eduflow123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
api:
  key: ${API_KEY:COURSE-SERVICE-KEY-2024}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
