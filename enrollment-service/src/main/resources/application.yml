server:
  port: 8083
spring:
  application:
    name: enrollment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/enrollment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
api:
  key: ${API_KEY:ENROLLMENT-SERVICE-KEY-2024}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
